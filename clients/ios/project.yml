name: TrajectoryMobile
options:
  bundleIdPrefix: cc.sevenb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_NAME: "$(TARGET_NAME)"
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TrajectoryMobileApp:
    type: application
    platform: iOS
    sources:
      - path: TrajectoryMobileApp/Sources/App
      - path: TrajectoryMobileApp/Sources/Model
      - path: TrajectoryMobileApp/Sources/Generated
    resources:
      - path: TrajectoryMobileApp/Resources
        excludes:
          - PacketTunnelInfo.plist
    info:
      path: TrajectoryMobileApp/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.sevenb.trajectorymobile
        INFOPLIST_FILE: TrajectoryMobileApp/Resources/Info.plist
