[workspace]
members = [
    "crates/trajectory-core",
    "crates/trajectory-cli",
    "crates/trajectory-vpn-bridge",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.29"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1.0"
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["full"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
