[workspace]
members = [
    "crates/trajectory-core",
    "crates/trajectory-cli",
    "clients/desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
eframe = "0.33"
egui = "0.33"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.48", features = ["full"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "debuginfo"
