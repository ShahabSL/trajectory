name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      live_e2e:
        description: Run protected live e2e through the trajectory-live-e2e environment
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run unit and binary tests
        run: cargo test -p trajectory-core -p trajectory-cli -p trajectory-vpn-bridge --lib --bins

  local-e2e:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Run local protocol integration tests
        run: |
          cargo test -p trajectory-core --test core_wire
          cargo test -p trajectory-cli --test loopback_e2e

  clippy:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Run clippy
        run: cargo clippy -p trajectory-core -p trajectory-cli -p trajectory-vpn-bridge --all-targets -- -D warnings

  package-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build CLI release bundles
        run: python scripts/package_release.py --target ${{ matrix.target }} --output-dir dist/ci

      - name: Smoke-test CLI release bundles
        run: python scripts/ci_smoke_release_bundles.py dist/ci

      - name: Upload CLI CI bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-cli-release-bundles-${{ matrix.target }}
          path: dist/ci/*
          if-no-files-found: ignore
          retention-days: 3

  desktop-client:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            imagemagick \
            xvfb \
            rpm \
            cpio \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Assert desktop target matches runner
        shell: bash
        run: |
          host="$(rustc -vV | awk '/host:/ {print $2}')"
          test "$host" = "${{ matrix.target }}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: clients/desktop

      - name: Build desktop web UI
        run: npm run build
        working-directory: clients/desktop

      - name: Install desktop UI smoke browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: clients/desktop

      - name: Install desktop UI smoke browser
        if: runner.os != 'Linux'
        run: npx playwright install chromium
        working-directory: clients/desktop

      - name: Remove macOS Setup Assistant before desktop smoke
        if: runner.os == 'macOS'
        run: scripts/ci_macos_remove_setup_assistant.sh

      - name: Smoke-test desktop UI
        run: npm run ui:smoke -- --preview "${{ runner.temp }}/desktop-ui"
        working-directory: clients/desktop

      - name: Upload desktop UI smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-desktop-ui-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-ui
          if-no-files-found: ignore
          retention-days: 3

      - name: Check Tauri desktop backend
        run: npm run tauri:check
        working-directory: clients/desktop

      - name: Build Tauri desktop bundle
        if: runner.os != 'Windows'
        run: npm run tauri:build
        working-directory: clients/desktop

      - name: Build Tauri Windows portable app
        if: runner.os == 'Windows'
        run: |
          npm run sidecar:stage
          npm run tauri -- build --no-bundle
          npm run package:windows-portable
        working-directory: clients/desktop

      - name: Archive macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="clients/desktop/src-tauri/target/release/bundle/macos/Trajectory.app"
          test -d "$app_path"
          tar -C "$(dirname "$app_path")" \
            -czf "clients/desktop/src-tauri/target/release/bundle/macos/Trajectory_${{ matrix.target }}.app.tar.gz" \
            "$(basename "$app_path")"

      - name: Remove macOS Setup Assistant before package smoke
        if: runner.os == 'macOS'
        run: scripts/ci_macos_remove_setup_assistant.sh

      - name: Smoke-test Tauri desktop package
        env:
          TRAJECTORY_DESKTOP_SMOKE_DOMAIN: ${{ secrets.TRAJECTORY_E2E_DOMAIN }}
          TRAJECTORY_DESKTOP_SMOKE_ACCESS_KEY: ${{ secrets.TRAJECTORY_E2E_ACCESS_KEY }}
          TRAJECTORY_DESKTOP_SMOKE_RESOLVERS: ${{ secrets.TRAJECTORY_E2E_RESOLVERS }}
          TRAJECTORY_DESKTOP_SMOKE_RESOLVER_SOCKS_PROXY: ${{ secrets.TRAJECTORY_E2E_RESOLVER_SOCKS_PROXY }}
          TRAJECTORY_DESKTOP_SMOKE_FETCH_URL: http://example.com/
          TRAJECTORY_DESKTOP_SMOKE_DNS_MAX_PAYLOAD: ${{ secrets.TRAJECTORY_E2E_DNS_MAX_PAYLOAD }}
          TRAJECTORY_DESKTOP_SMOKE_HTTP_PORT: ${{ secrets.TRAJECTORY_E2E_HTTP_LISTEN_PORT }}
          TRAJECTORY_DESKTOP_SMOKE_LOCAL_SERVER: "1"
          TRAJECTORY_DESKTOP_SMOKE_REQUIRE_LIVE: "1"
        run: npm run package:smoke -- "${{ runner.temp }}/desktop-package"
        working-directory: clients/desktop

      - name: Upload desktop package smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-desktop-package-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-package
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload desktop CI bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-desktop-${{ matrix.os }}
          path: |
            clients/desktop/src-tauri/target/release/bundle/**/*
            !clients/desktop/src-tauri/target/release/bundle/**/*.msi
            !clients/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: ignore
          retention-days: 3

  android-client:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android targets
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Run Android JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: clients/android

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug :smokeprobe:assembleDebug --no-daemon
        working-directory: clients/android

      - name: Create Android CI release signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/trajectory-ci-release.jks" \
            -storepass trajectory-ci \
            -keypass trajectory-ci \
            -alias trajectory-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=Trajectory CI,O=Trajectory,C=US"
          {
            echo "TRAJECTORY_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/trajectory-ci-release.jks"
            echo "TRAJECTORY_ANDROID_KEYSTORE_PASSWORD=trajectory-ci"
            echo "TRAJECTORY_ANDROID_KEY_ALIAS=trajectory-ci"
            echo "TRAJECTORY_ANDROID_KEY_PASSWORD=trajectory-ci"
          } >> "$GITHUB_ENV"

      - name: Build Android release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: clients/android

      - name: Check Android VPN manifests and packaged native libraries
        run: |
          scripts/ci_android_vpn_static_checks.sh clients/android/app/build/outputs/apk/debug/app-debug.apk
          scripts/ci_android_vpn_static_checks.sh clients/android/app/build/outputs/apk/release/app-release.apk

      - name: Verify Android APK signatures
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose clients/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose clients/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ci-android-debug-apk
          path: clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        with:
          name: ci-android-signed-release-apk
          path: clients/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android smoke probe APK
        uses: actions/upload-artifact@v7
        with:
          name: ci-android-smokeprobe-apk
          path: clients/android/smokeprobe/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  android-x86-runtime:
    needs: android-client
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api35-debug
            api_level: 35
            apk_artifact: ci-android-debug-apk
            apk_dir: android-debug-apk
            smoke_dir: android-ui-api35-debug
            compact: "false"
          - name: api35-release
            api_level: 35
            apk_artifact: ci-android-signed-release-apk
            apk_dir: android-release-apk
            smoke_dir: android-ui-api35-release
            compact: "false"
          - name: api33-debug-compact
            api_level: 33
            apk_artifact: ci-android-debug-apk
            apk_dir: android-debug-apk
            smoke_dir: android-ui-api33-debug
            compact: "true"
          - name: api28-release
            api_level: 28
            apk_artifact: ci-android-signed-release-apk
            apk_dir: android-release-apk
            smoke_dir: android-ui-api28-release
            compact: "false"
          - name: api26-release
            api_level: 26
            apk_artifact: ci-android-signed-release-apk
            apk_dir: android-release-apk
            smoke_dir: android-ui-api26-release
            compact: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.apk_artifact }}
          path: ${{ runner.temp }}/${{ matrix.apk_dir }}

      - name: Download Android smoke probe APK
        uses: actions/download-artifact@v5
        with:
          name: ci-android-smokeprobe-apk
          path: ${{ runner.temp }}/android-smokeprobe-apk

      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test Android x86 ${{ matrix.name }} UI
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TRAJECTORY_ANDROID_SMOKE_DOMAIN: ${{ secrets.TRAJECTORY_E2E_DOMAIN }}
          TRAJECTORY_ANDROID_SMOKE_ACCESS_KEY: ${{ secrets.TRAJECTORY_E2E_ACCESS_KEY }}
          TRAJECTORY_ANDROID_SMOKE_RESOLVERS: ${{ secrets.TRAJECTORY_E2E_RESOLVERS }}
          TRAJECTORY_ANDROID_SMOKE_FETCH_URL: ${{ secrets.TRAJECTORY_E2E_FETCH_URL }}
          TRAJECTORY_ANDROID_SMOKE_HTTP_PORT: ${{ secrets.TRAJECTORY_E2E_HTTP_LISTEN_PORT }}
          TRAJECTORY_ANDROID_SMOKE_LOCAL_SERVER: "1"
          TRAJECTORY_ANDROID_SMOKE_REQUIRE_LIVE: "1"
          TRAJECTORY_ANDROID_SMOKE_REQUIRE_VPN: "1"
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            test -n "$(find "$RUNNER_TEMP/${{ matrix.apk_dir }}" -name '*.apk' -print -quit)"
            test -n "$(find "$RUNNER_TEMP/android-smokeprobe-apk" -name '*.apk' -print -quit)"
            [ "${{ matrix.compact }}" != "true" ] || adb shell wm size 720x1280
            [ "${{ matrix.compact }}" != "true" ] || adb shell settings put system font_scale 1.25
            TRAJECTORY_ANDROID_SMOKE_PROBE_APK="$(find "$RUNNER_TEMP/android-smokeprobe-apk" -name '*.apk' -print -quit)" scripts/ci_android_ui_smoke.sh "$(find "$RUNNER_TEMP/${{ matrix.apk_dir }}" -name '*.apk' -print -quit)" "$RUNNER_TEMP/${{ matrix.smoke_dir }}"

      - name: Upload Android x86 UI smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-android-x86-ui-smoke-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/${{ matrix.smoke_dir }}
            !${{ runner.temp }}/${{ matrix.smoke_dir }}/*logcat*.txt
            !${{ runner.temp }}/${{ matrix.smoke_dir }}/*.log
          if-no-files-found: ignore
          retention-days: 3

  android-arm64-runtime:
    name: android-arm64 package smoke
    needs: android-client
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android package validation tools
        run: sdkmanager "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: Download signed Android release APK
        uses: actions/download-artifact@v5
        with:
          name: ci-android-signed-release-apk
          path: ${{ runner.temp }}/android-release-apk

      - name: Verify Android ARM64 package contents
        shell: bash
        run: |
          scripts/ci_android_apk_package_smoke.sh \
            "$(find "$RUNNER_TEMP/android-release-apk" -name '*.apk' -print -quit)" \
            "$RUNNER_TEMP/android-arm64-package-smoke"

      - name: Upload Android ARM64 package smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-android-arm64-package-smoke
          path: ${{ runner.temp }}/android-arm64-package-smoke
          if-no-files-found: ignore
          retention-days: 3

  cross-platform-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
          - os: macos-15-intel
          - os: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Build workspace
        run: cargo build --release --workspace

  live-e2e:
    needs: [unit, local-e2e, clippy, package-cli, desktop-client, android-client, android-x86-runtime, android-arm64-runtime, cross-platform-build]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.live_e2e && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TRAJECTORY_E2E_ENABLED == 'true') }}
    runs-on: ubuntu-22.04
    environment: trajectory-live-e2e
    timeout-minutes: 15
    concurrency:
      group: trajectory-live-e2e
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Run protected live e2e
        env:
          TRAJECTORY_E2E_DOMAIN: ${{ secrets.TRAJECTORY_E2E_DOMAIN }}
          TRAJECTORY_E2E_ACCESS_KEY: ${{ secrets.TRAJECTORY_E2E_ACCESS_KEY }}
          TRAJECTORY_E2E_RESOLVERS: ${{ secrets.TRAJECTORY_E2E_RESOLVERS }}
          TRAJECTORY_E2E_RESOLVER_SOCKS_PROXY: ${{ secrets.TRAJECTORY_E2E_RESOLVER_SOCKS_PROXY }}
          TRAJECTORY_E2E_FETCH_URL: ${{ secrets.TRAJECTORY_E2E_FETCH_URL }}
          TRAJECTORY_E2E_DNS_MAX_PAYLOAD: ${{ secrets.TRAJECTORY_E2E_DNS_MAX_PAYLOAD }}
          TRAJECTORY_E2E_HTTP_LISTEN_PORT: ${{ secrets.TRAJECTORY_E2E_HTTP_LISTEN_PORT }}
        run: scripts/ci_live_e2e.sh
