name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      live_e2e:
        description: Run protected live e2e through the trajectory-live-e2e environment
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run unit and binary tests
        run: cargo test -p trajectory-core -p trajectory-cli -p trajectory-vpn-bridge --lib --bins

  local-e2e:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Run local protocol integration tests
        run: |
          cargo test -p trajectory-core --test core_wire
          cargo test -p trajectory-cli --test loopback_e2e

  clippy:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Run clippy
        run: cargo clippy -p trajectory-core -p trajectory-cli -p trajectory-vpn-bridge --all-targets -- -D warnings

  package-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Linux release bundles
        run: python3 scripts/package_release.py --target x86_64-unknown-linux-gnu --output-dir dist/ci

      - name: Upload Linux CI bundles
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-release-bundles
          path: dist/ci/*
          if-no-files-found: error
          retention-days: 7

  desktop-client:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
          - macos-15-intel

    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: clients/desktop

      - name: Build desktop web UI
        run: npm run build
        working-directory: clients/desktop

      - name: Check Tauri desktop backend
        run: npm run tauri:check
        working-directory: clients/desktop

      - name: Build Tauri desktop bundle
        run: npm run tauri:build
        working-directory: clients/desktop

      - name: Upload desktop CI bundles
        uses: actions/upload-artifact@v4
        with:
          name: ci-desktop-${{ matrix.os }}
          path: clients/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

  android-client:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android targets
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Run Android JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: clients/android

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: clients/android

      - name: Build Android release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: clients/android

      - name: Check Android VPN manifest and packaged native libraries
        run: scripts/ci_android_vpn_static_checks.sh clients/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify Android debug APK is installable
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose clients/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: scripts/ci_android_ui_smoke.sh clients/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/android-ui"

      - name: Upload Android UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-android-ui-smoke
          path: ${{ runner.temp }}/android-ui
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-android-debug-apk
          path: clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-android-unsigned-release-apk
          path: clients/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  cross-platform-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
          - os: macos-15-intel

    steps:
      - uses: actions/checkout@v5

      - name: Build workspace
        run: cargo build --release --workspace

  live-e2e:
    needs: [unit, local-e2e, clippy, package-linux, desktop-client, android-client, cross-platform-build]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.live_e2e && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TRAJECTORY_E2E_ENABLED == 'true') }}
    runs-on: ubuntu-22.04
    environment: trajectory-live-e2e
    timeout-minutes: 15
    concurrency:
      group: trajectory-live-e2e
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Run protected live e2e
        env:
          TRAJECTORY_E2E_DOMAIN: ${{ secrets.TRAJECTORY_E2E_DOMAIN }}
          TRAJECTORY_E2E_ACCESS_KEY: ${{ secrets.TRAJECTORY_E2E_ACCESS_KEY }}
          TRAJECTORY_E2E_RESOLVERS: ${{ secrets.TRAJECTORY_E2E_RESOLVERS }}
          TRAJECTORY_E2E_RESOLVER_SOCKS_PROXY: ${{ secrets.TRAJECTORY_E2E_RESOLVER_SOCKS_PROXY }}
          TRAJECTORY_E2E_FETCH_URL: ${{ secrets.TRAJECTORY_E2E_FETCH_URL }}
          TRAJECTORY_E2E_DNS_MAX_PAYLOAD: ${{ secrets.TRAJECTORY_E2E_DNS_MAX_PAYLOAD }}
          TRAJECTORY_E2E_HTTP_LISTEN_PORT: ${{ secrets.TRAJECTORY_E2E_HTTP_LISTEN_PORT }}
        run: scripts/ci_live_e2e.sh
