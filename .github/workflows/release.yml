name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to package and publish"
        required: true
        type: string
      draft:
        description: "Create or update the GitHub release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Check out release tag
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Build portable bundles
        shell: bash
        run: |
          python scripts/package_release.py \
            --target "${{ matrix.target }}" \
            --output-dir dist/release \
            --release-tag "$RELEASE_TAG"

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
            echo "RELEASE_DRAFT=${{ inputs.draft }}" >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=${{ inputs.prerelease }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_DRAFT=false" >> "$GITHUB_ENV"
            case "${GITHUB_REF_NAME}" in
              *-alpha*|*-beta*|*-rc*)
                echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
                ;;
              *)
                echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
                ;;
            esac
          fi

      - name: Download release bundles
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Merge checksum manifests
        shell: bash
        run: |
          python scripts/merge_release_checksums.py \
            --input-dir dist/release \
            --output "dist/release/${RELEASE_TAG}-SHA256SUMS.txt"

      - name: Ensure GitHub CLI is available
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --tags --force
          draft_flag=()
          prerelease_flag=()
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            draft_flag+=(--draft)
          fi
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --verify-tag \
              --generate-notes \
              "${draft_flag[@]}" \
              "${prerelease_flag[@]}"
          fi
