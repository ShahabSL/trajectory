name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to package and publish"
        required: true
        type: string
      draft:
        description: "Create or update the GitHub release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release ref
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Check out release tag
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Build portable bundles
        shell: bash
        run: |
          python scripts/package_release.py \
            --target "${{ matrix.target }}" \
            --output-dir dist/release \
            --release-tag "$RELEASE_TAG"

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release ref
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Check out release tag
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: clients/desktop

      - name: Build Tauri desktop bundle
        run: npm run tauri:build
        working-directory: clients/desktop

      - name: Upload desktop release bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: clients/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release ref
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Check out release tag
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android targets
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Run Android JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: clients/android

      - name: Build Android release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: clients/android

      - name: Check Android VPN manifest and packaged native libraries
        run: scripts/ci_android_vpn_static_checks.sh clients/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: clients/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - build
      - desktop
      - android
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release ref
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
            release_draft="$INPUT_DRAFT"
            release_prerelease="$INPUT_PRERELEASE"
          else
            release_tag="$GITHUB_REF_NAME"
            release_draft=false
            case "${GITHUB_REF_NAME}" in
              *-alpha*|*-beta*|*-rc*)
                release_prerelease=true
                ;;
              *)
                release_prerelease=false
                ;;
            esac
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $release_tag" >&2
            exit 1
          fi
          case "$release_draft" in true|false) ;; *) echo "invalid draft value" >&2; exit 1 ;; esac
          case "$release_prerelease" in true|false) ;; *) echo "invalid prerelease value" >&2; exit 1 ;; esac
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_DRAFT=$release_draft" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=$release_prerelease" >> "$GITHUB_ENV"

      - name: Check out release tag
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Download CLI release bundles
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Download desktop release bundles
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true

      - name: Download Android release APK
        uses: actions/download-artifact@v5
        with:
          pattern: android-*
          path: dist/release
          merge-multiple: true

      - name: Merge checksum manifests
        shell: bash
        run: |
          python scripts/merge_release_checksums.py \
            --input-dir dist/release \
            --output "dist/release/${RELEASE_TAG}-SHA256SUMS.txt"

      - name: Ensure GitHub CLI is available
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --tags --force
          draft_flag=()
          prerelease_flag=()
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            draft_flag+=(--draft)
          fi
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(
            find dist/release -type f \
              ! -path '*/.*' \
              \( -name 'trajectory-v*.tar.gz' \
                 -o -name 'trajectory-v*.zip' \
                 -o -name '*SHA256SUMS.txt' \
                 -o -name '*.deb' \
                 -o -name '*.rpm' \
                 -o -name '*.AppImage' \
                 -o -name '*.msi' \
                 -o -name '*.exe' \
                 -o -name '*.dmg' \
                 -o -name '*.app.tar.gz' \
                 -o -name '*.apk' \) \
              -print0
          )

          if (( ${#assets[@]} == 0 )); then
            echo "no release assets found" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              "${draft_flag[@]}" \
              "${prerelease_flag[@]}"
          fi
