name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to package and publish"
        required: true
        type: string
      draft:
        description: "Create or update the GitHub release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release ref
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Verify release tag is on main
        shell: bash
        run: |
          git fetch origin main --tags --force
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Check out release tag
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Validate release versions
        shell: bash
        run: python scripts/validate_release_versions.py --release-tag "$RELEASE_TAG"

      - name: Build portable bundles
        shell: bash
        run: |
          python scripts/package_release.py \
            --target "${{ matrix.target }}" \
            --output-dir dist/release \
            --release-tag "$RELEASE_TAG"

      - name: Smoke-test portable bundles
        shell: bash
        run: python scripts/ci_smoke_release_bundles.py dist/release

      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release ref
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Verify release tag is on main
        shell: bash
        run: |
          git fetch origin main --tags --force
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Check out release tag
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release versions
        shell: bash
        run: python scripts/validate_release_versions.py --release-tag "$RELEASE_TAG"

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            xvfb \
            rpm \
            cpio \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Assert desktop target matches runner
        shell: bash
        run: |
          host="$(rustc -vV | awk '/host:/ {print $2}')"
          test "$host" = "${{ matrix.target }}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: clients/desktop

      - name: Build desktop web UI
        run: npm run build
        working-directory: clients/desktop

      - name: Install desktop UI smoke browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: clients/desktop

      - name: Install desktop UI smoke browser
        if: runner.os != 'Linux'
        run: npx playwright install chromium
        working-directory: clients/desktop

      - name: Smoke-test desktop UI
        run: npm run ui:smoke -- --preview "${{ runner.temp }}/desktop-ui"
        working-directory: clients/desktop

      - name: Upload desktop release UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-ui-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-ui
          if-no-files-found: error
          retention-days: 14

      - name: Build Tauri desktop bundle
        run: npm run tauri:build
        working-directory: clients/desktop

      - name: Archive macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="clients/desktop/src-tauri/target/release/bundle/macos/Trajectory.app"
          test -d "$app_path"
          tar -C "$(dirname "$app_path")" \
            -czf "clients/desktop/src-tauri/target/release/bundle/macos/Trajectory_${RELEASE_TAG}_${{ matrix.target }}.app.tar.gz" \
            "$(basename "$app_path")"

      - name: Smoke-test Tauri desktop package
        env:
          TRAJECTORY_DESKTOP_SMOKE_DOMAIN: ${{ secrets.TRAJECTORY_E2E_DOMAIN }}
          TRAJECTORY_DESKTOP_SMOKE_ACCESS_KEY: ${{ secrets.TRAJECTORY_E2E_ACCESS_KEY }}
          TRAJECTORY_DESKTOP_SMOKE_RESOLVERS: ${{ secrets.TRAJECTORY_E2E_RESOLVERS }}
          TRAJECTORY_DESKTOP_SMOKE_RESOLVER_SOCKS_PROXY: ${{ secrets.TRAJECTORY_E2E_RESOLVER_SOCKS_PROXY }}
          TRAJECTORY_DESKTOP_SMOKE_FETCH_URL: http://example.com/
          TRAJECTORY_DESKTOP_SMOKE_DNS_MAX_PAYLOAD: ${{ secrets.TRAJECTORY_E2E_DNS_MAX_PAYLOAD }}
          TRAJECTORY_DESKTOP_SMOKE_HTTP_PORT: ${{ secrets.TRAJECTORY_E2E_HTTP_LISTEN_PORT }}
        run: npm run package:smoke -- "${{ runner.temp }}/desktop-package"
        working-directory: clients/desktop

      - name: Upload desktop release package smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-package-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-package
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop release bundles
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: clients/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-22.04
    environment: trajectory-release-signing

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release ref
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Verify release tag is on main
        shell: bash
        run: |
          git fetch origin main --tags --force
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Check out release tag
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release versions
        shell: bash
        run: python scripts/validate_release_versions.py --release-tag "$RELEASE_TAG"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android targets
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Decode Android release signing key
        id: android_signing
        shell: bash
        env:
          TRAJECTORY_ANDROID_KEYSTORE_BASE64: ${{ secrets.TRAJECTORY_ANDROID_KEYSTORE_BASE64 }}
          TRAJECTORY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRAJECTORY_ANDROID_KEYSTORE_PASSWORD }}
          TRAJECTORY_ANDROID_KEY_ALIAS: ${{ secrets.TRAJECTORY_ANDROID_KEY_ALIAS }}
          TRAJECTORY_ANDROID_KEY_PASSWORD: ${{ secrets.TRAJECTORY_ANDROID_KEY_PASSWORD }}
        run: |
          required=(
            TRAJECTORY_ANDROID_KEYSTORE_BASE64
            TRAJECTORY_ANDROID_KEYSTORE_PASSWORD
            TRAJECTORY_ANDROID_KEY_ALIAS
            TRAJECTORY_ANDROID_KEY_PASSWORD
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing Android signing secret::$name is required for installable release APKs"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          signing_dir="$RUNNER_TEMP/trajectory-android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$TRAJECTORY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          chmod 600 "$signing_dir/release.jks"
          echo "keystore_file=$signing_dir/release.jks" >> "$GITHUB_OUTPUT"

      - name: Run Android JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: clients/android

      - name: Build signed Android release APK
        env:
          TRAJECTORY_ANDROID_KEYSTORE_FILE: ${{ steps.android_signing.outputs.keystore_file }}
          TRAJECTORY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TRAJECTORY_ANDROID_KEYSTORE_PASSWORD }}
          TRAJECTORY_ANDROID_KEY_ALIAS: ${{ secrets.TRAJECTORY_ANDROID_KEY_ALIAS }}
          TRAJECTORY_ANDROID_KEY_PASSWORD: ${{ secrets.TRAJECTORY_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: clients/android

      - name: Verify Android release APK
        run: |
          apk="clients/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          scripts/ci_android_vpn_static_checks.sh "$apk"

      - name: Stage Android release APK
        shell: bash
        run: |
          mkdir -p dist/android
          cp clients/android/app/build/outputs/apk/release/app-release.apk \
            "dist/android/trajectory-${RELEASE_TAG}-android.apk"

      - name: Remove Android signing key before emulator smoke
        if: always()
        shell: bash
        run: |
          rm -f "${{ steps.android_signing.outputs.keystore_file }}"

      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test signed Android release UI
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TRAJECTORY_ANDROID_SMOKE_DOMAIN: ${{ secrets.TRAJECTORY_E2E_DOMAIN }}
          TRAJECTORY_ANDROID_SMOKE_ACCESS_KEY: ${{ secrets.TRAJECTORY_E2E_ACCESS_KEY }}
          TRAJECTORY_ANDROID_SMOKE_RESOLVERS: ${{ secrets.TRAJECTORY_E2E_RESOLVERS }}
          TRAJECTORY_ANDROID_SMOKE_FETCH_URL: ${{ secrets.TRAJECTORY_E2E_FETCH_URL }}
          TRAJECTORY_ANDROID_SMOKE_HTTP_PORT: ${{ secrets.TRAJECTORY_E2E_HTTP_LISTEN_PORT }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: scripts/ci_android_ui_smoke.sh clients/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/android-ui"

      - name: Reclaim Android API 35 emulator disk
        if: always()
        run: scripts/ci_android_reclaim_emulator_disk.sh 35

      - name: Smoke-test signed Android API 33 compact UI
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TRAJECTORY_ANDROID_SMOKE_DOMAIN: ${{ secrets.TRAJECTORY_E2E_DOMAIN }}
          TRAJECTORY_ANDROID_SMOKE_ACCESS_KEY: ${{ secrets.TRAJECTORY_E2E_ACCESS_KEY }}
          TRAJECTORY_ANDROID_SMOKE_RESOLVERS: ${{ secrets.TRAJECTORY_E2E_RESOLVERS }}
          TRAJECTORY_ANDROID_SMOKE_FETCH_URL: ${{ secrets.TRAJECTORY_E2E_FETCH_URL }}
          TRAJECTORY_ANDROID_SMOKE_HTTP_PORT: ${{ secrets.TRAJECTORY_E2E_HTTP_LISTEN_PORT }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            adb shell wm size 720x1280
            adb shell settings put system font_scale 1.25
            scripts/ci_android_ui_smoke.sh clients/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/android-ui-api33"

      - name: Reclaim Android API 33 emulator disk
        if: always()
        run: scripts/ci_android_reclaim_emulator_disk.sh 33

      - name: Smoke-test signed Android min-SDK-era UI
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TRAJECTORY_ANDROID_SMOKE_DOMAIN: ${{ secrets.TRAJECTORY_E2E_DOMAIN }}
          TRAJECTORY_ANDROID_SMOKE_ACCESS_KEY: ${{ secrets.TRAJECTORY_E2E_ACCESS_KEY }}
          TRAJECTORY_ANDROID_SMOKE_RESOLVERS: ${{ secrets.TRAJECTORY_E2E_RESOLVERS }}
          TRAJECTORY_ANDROID_SMOKE_FETCH_URL: ${{ secrets.TRAJECTORY_E2E_FETCH_URL }}
          TRAJECTORY_ANDROID_SMOKE_HTTP_PORT: ${{ secrets.TRAJECTORY_E2E_HTTP_LISTEN_PORT }}
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: scripts/ci_android_ui_smoke.sh clients/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/android-ui-api28"

      - name: Upload Android release UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-ui-smoke
          path: |
            ${{ runner.temp }}/android-ui
            ${{ runner.temp }}/android-ui-api33
            ${{ runner.temp }}/android-ui-api28
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android signed release APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - build
      - desktop
      - android
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release ref
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
            release_draft="$INPUT_DRAFT"
            release_prerelease="$INPUT_PRERELEASE"
          else
            release_tag="$GITHUB_REF_NAME"
            release_draft=false
            case "${GITHUB_REF_NAME}" in
              *-alpha*|*-beta*|*-rc*)
                release_prerelease=true
                ;;
              *)
                release_prerelease=false
                ;;
            esac
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $release_tag" >&2
            exit 1
          fi
          case "$release_draft" in true|false) ;; *) echo "invalid draft value" >&2; exit 1 ;; esac
          case "$release_prerelease" in true|false) ;; *) echo "invalid prerelease value" >&2; exit 1 ;; esac
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_DRAFT=$release_draft" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=$release_prerelease" >> "$GITHUB_ENV"

      - name: Verify release tag is on main
        shell: bash
        run: |
          git fetch origin main --tags --force
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Check out release tag
        shell: bash
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Validate release versions
        shell: bash
        run: python scripts/validate_release_versions.py --release-tag "$RELEASE_TAG"

      - name: Download CLI release bundles
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Download desktop release bundles
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-x86_64-*
          path: dist/release
          merge-multiple: true

      - name: Download Apple Silicon desktop release bundles
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-aarch64-*
          path: dist/release
          merge-multiple: true

      - name: Download Android release APK
        uses: actions/download-artifact@v5
        with:
          pattern: android-release-apk
          path: dist/release
          merge-multiple: true

      - name: Set up Java for Android publish validation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK for publish validation
        uses: android-actions/setup-android@v3

      - name: Install Android publish validation tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Merge checksum manifests
        shell: bash
        run: |
          python scripts/merge_release_checksums.py \
            --input-dir dist/release \
            --output "dist/release/${RELEASE_TAG}-SHA256SUMS.txt"

      - name: Validate release asset set
        shell: bash
        run: python scripts/validate_release_assets.py dist/release --release-tag "$RELEASE_TAG"

      - name: Validate Android release APK metadata and signature
        shell: bash
        run: scripts/validate_android_release_apk.sh "dist/release/trajectory-${RELEASE_TAG}-android.apk" "$RELEASE_TAG"

      - name: Ensure GitHub CLI is available
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --tags --force
          draft_flag=()
          prerelease_flag=()
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            draft_flag+=(--draft)
          fi
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(
            find dist/release -type f \
              ! -path '*/.*' \
              \( -name 'trajectory-v*.tar.gz' \
                 -o -name 'trajectory-v*.zip' \
                 -o -name '*SHA256SUMS.txt' \
                 -o -name '*.deb' \
                 -o -name '*.rpm' \
                 -o -name '*.AppImage' \
                 -o -name '*.msi' \
                 -o -name '*.exe' \
                 -o -name '*.dmg' \
                 -o -name '*.app.tar.gz' \
                 -o -name '*.apk' \) \
              -print0
          )

          if (( ${#assets[@]} == 0 )); then
            echo "no release assets found" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              "${draft_flag[@]}" \
              "${prerelease_flag[@]}"
          fi
