[package]
name = "trajectory-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "CLI client and server binaries for the Trajectory recursive-DNS tunnel"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
trajectory-core = { path = "../trajectory-core" }

[[bin]]
name = "trajectory-client"
path = "src/bin/trajectory-client.rs"

[[bin]]
name = "trajectory-server"
path = "src/bin/trajectory-server.rs"
